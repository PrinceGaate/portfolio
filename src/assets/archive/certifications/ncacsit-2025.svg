<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGradNcacsit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e0c" />
      <stop offset="50%" stop-color="#111611" />
      <stop offset="100%" stop-color="#090c09" />
    </linearGradient>
    <pattern id="gridNcacsit" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#33ff33" stroke-width="0.5" stroke-opacity="0.04" />
    </pattern>
    <filter id="glowNcacsit" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGradNcacsit)" />
  <rect width="1200" height="800" fill="url(#gridNcacsit)" />

  <!-- Outer Terminal Border -->
  <rect x="30" y="30" width="1140" height="740" fill="none" stroke="#33ff33" stroke-width="1.2" stroke-opacity="0.3" />
  <rect x="42" y="42" width="1116" height="716" fill="none" stroke="#33ff33" stroke-width="0.8" stroke-dasharray="8 4" stroke-opacity="0.2" />

  <!-- Corner Brackets -->
  <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#33ff33" stroke-width="3" />
  <path d="M 1150 20 L 1180 20 L 1180 50" fill="none" stroke="#33ff33" stroke-width="3" />
  <path d="M 20 750 L 20 780 L 50 780" fill="none" stroke="#33ff33" stroke-width="3" />
  <path d="M 1150 780 L 1180 780 L 1180 750" fill="none" stroke="#33ff33" stroke-width="3" />

  <!-- Top System Header Strip -->
  <g fill="#33ff33" font-family="'Courier New', monospace" font-size="12" letter-spacing="3" opacity="0.75">
    <text x="70" y="80">&gt; PRINCE.OS // CREDENTIAL_STORAGE // NCACSIT-2025</text>
    <text x="1130" y="80" text-anchor="end">CONFERENCE_PAPER.ARCHIVE</text>
    <line x1="70" y1="95" x2="1130" y2="95" stroke="#33ff33" stroke-width="0.8" stroke-opacity="0.3" />
  </g>

  <!-- Technical Icon / Hex Presentation Badge -->
  <g transform="translate(600, 175)" filter="url(#glowNcacsit)">
    <polygon points="0,-45 40,-22 40,22 0,45 -40,22 -40,-22" fill="#0b170b" stroke="#33ff33" stroke-width="2" stroke-opacity="0.85" />
    <!-- Paper / Presentation screen vector -->
    <rect x="-18" y="-14" width="36" height="24" rx="2" fill="none" stroke="#33ff33" stroke-width="2" />
    <line x1="-12" y1="-7" x2="12" y2="-7" stroke="#33ff33" stroke-width="1.8" />
    <line x1="-12" y1="-1" x2="6" y2="-1" stroke="#33ff33" stroke-width="1.8" />
    <line x1="-12" y1="5" x2="2" y2="5" stroke="#33ff33" stroke-width="1.8" />
    <line x1="-5" y1="10" x2="-10" y2="18" stroke="#33ff33" stroke-width="2" />
    <line x1="5" y1="10" x2="10" y2="18" stroke="#33ff33" stroke-width="2" />
    <line x1="-14" y1="18" x2="14" y2="18" stroke="#33ff33" stroke-width="2" />
  </g>

  <!-- Category & Conference Header -->
  <text x="600" y="260" fill="#a1a1aa" font-family="'Courier New', monospace" font-size="13" text-anchor="middle" letter-spacing="4">
    NATIONAL CONFERENCE ON ADVANCE COMPUTER SCIENCE &amp; INFORMATION TECHNOLOGY
  </text>
  <text x="600" y="302" fill="#eeffe4" font-family="'Space Grotesk', 'Courier New', monospace" font-size="34" font-weight="bold" text-anchor="middle" letter-spacing="6">
    NCACSIT–2025
  </text>

  <!-- Presentation Statement Container -->
  <g transform="translate(600, 395)">
    <rect x="-440" y="-55" width="880" height="110" rx="4" fill="#0a120a" stroke="#33ff33" stroke-width="1" stroke-opacity="0.35" />
    <text x="0" y="-22" fill="#71717a" font-family="'Courier New', monospace" font-size="12" text-anchor="middle" letter-spacing="3">
      PRESENTED TEAM RESEARCH PAPER:
    </text>
    <text x="0" y="16" fill="#33ff33" font-family="'Space Grotesk', 'Courier New', monospace" font-size="19" font-weight="bold" text-anchor="middle" letter-spacing="2">
      “Technology-Driven Rescue and Welfare Systems for Stray Animals”
    </text>
  </g>

  <!-- Author / Candidate Details -->
  <line x1="380" y1="495" x2="820" y2="495" stroke="#33ff33" stroke-width="1" stroke-opacity="0.3" />
  <text x="600" y="530" fill="#eeffe4" font-family="'Courier New', monospace" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="5">
    PRINCE KUMAR GAATE
  </text>
  <text x="600" y="555" fill="#71717a" font-family="'Courier New', monospace" font-size="11" text-anchor="middle" letter-spacing="2">
    TEAM AUTHOR // RESEARCH PRESENTATION
  </text>

  <!-- Bottom Technical Manifest Grid -->
  <g transform="translate(100, 630)" font-family="'Courier New', monospace" font-size="11" fill="#71717a">
    <!-- Left Column: Conference Scope -->
    <text x="0" y="20" fill="#33ff33" font-weight="bold" letter-spacing="2">CONFERENCE FORUM:</text>
    <text x="0" y="42" fill="#d4d4d8" letter-spacing="1">NCACSIT–2025</text>
    <text x="0" y="62" letter-spacing="1">ADVANCE CS &amp; IT RESEARCH</text>

    <!-- Center Column: Presentation Seal -->
    <g transform="translate(500, -10)">
      <rect x="-40" y="-10" width="80" height="80" fill="#081008" stroke="#33ff33" stroke-width="1" stroke-opacity="0.4" />
      <polygon points="0,-2 18,12 18,36 0,50 -18,36 -18,12" fill="#33ff33" fill-opacity="0.15" stroke="#33ff33" stroke-width="1" />
      <text x="0" y="85" text-anchor="middle" font-size="8" fill="#33ff33" letter-spacing="1">PRESENTED</text>
    </g>

    <!-- Right Column: Verification Status -->
    <text x="1000" y="20" text-anchor="end" fill="#33ff33" font-weight="bold" letter-spacing="2">RECORD STATUS:</text>
    <text x="1000" y="42" text-anchor="end" fill="#eeffe4" letter-spacing="1">AUTHENTICATED PRESENTATION</text>
    <text x="1000" y="62" text-anchor="end" fill="#71717a" letter-spacing="1">SCAN REPLACEMENT READY</text>
  </g>

  <!-- Bottom Terminal String -->
  <line x1="70" y1="730" x2="1130" y2="730" stroke="#33ff33" stroke-width="0.8" stroke-opacity="0.2" />
  <text x="600" y="752" fill="#52525b" font-family="'Courier New', monospace" font-size="9" text-anchor="middle" letter-spacing="3">
    [ OFFICIAL RECORD // CONFIGURE IMAGE SCAN IN SRC/DATA/CERTIFICATIONSDATA.TS ]
  </text>
</svg>
