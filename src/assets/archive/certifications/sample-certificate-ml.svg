<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d10" />
      <stop offset="50%" stop-color="#121417" />
      <stop offset="100%" stop-color="#0a0b0d" />
    </linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.03" />
    </pattern>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad2)" />
  <rect width="1200" height="800" fill="url(#grid2)" />

  <!-- Outer Terminal Border -->
  <rect x="30" y="30" width="1140" height="740" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.25" />
  <rect x="42" y="42" width="1116" height="716" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="8 4" stroke-opacity="0.18" />

  <!-- Corner Brackets -->
  <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#38bdf8" stroke-width="3" />
  <path d="M 1150 20 L 1180 20 L 1180 50" fill="none" stroke="#38bdf8" stroke-width="3" />
  <path d="M 20 750 L 20 780 L 50 780" fill="none" stroke="#38bdf8" stroke-width="3" />
  <path d="M 1150 780 L 1180 780 L 1180 750" fill="none" stroke="#38bdf8" stroke-width="3" />

  <!-- Header Line -->
  <g fill="#38bdf8" font-family="'Courier New', monospace" font-size="12" letter-spacing="3" opacity="0.6">
    <text x="70" y="80">&gt; PRINCE.OS // MACHINE_LEARNING_ACCREDITATION</text>
    <text x="1130" y="80" text-anchor="end">SPEC.ML-PYTORCH.V2</text>
    <line x1="70" y1="95" x2="1130" y2="95" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.3" />
  </g>

  <!-- Watermark Badge -->
  <g transform="translate(600, 400) rotate(-18)" opacity="0.12">
    <rect x="-240" y="-55" width="480" height="110" fill="none" stroke="#38bdf8" stroke-width="5" stroke-dasharray="16 8" />
    <text x="0" y="15" fill="#38bdf8" font-family="'Courier New', monospace" font-size="34" font-weight="bold" text-anchor="middle" letter-spacing="6">
      SAMPLE CERTIFICATE
    </text>
  </g>

  <!-- Certificate Authority / Node Network Icon -->
  <g transform="translate(600, 175)" filter="url(#cyanGlow)">
    <circle cx="0" cy="0" r="32" fill="#061824" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.8" />
    <circle cx="-14" cy="-10" r="5" fill="#38bdf8" />
    <circle cx="14" cy="-10" r="5" fill="#38bdf8" />
    <circle cx="0" cy="14" r="5" fill="#38bdf8" />
    <line x1="-14" y1="-10" x2="14" y2="-10" stroke="#38bdf8" stroke-width="2" />
    <line x1="-14" y1="-10" x2="0" y2="14" stroke="#38bdf8" stroke-width="2" />
    <line x1="14" y1="-10" x2="0" y2="14" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- Certificate Title -->
  <text x="600" y="270" fill="#f0f9ff" font-family="'Space Grotesk', 'Courier New', monospace" font-size="36" font-weight="bold" text-anchor="middle" letter-spacing="8">
    SPECIALIZATION IN MACHINE LEARNING
  </text>
  <text x="600" y="305" fill="#38bdf8" font-family="'Courier New', monospace" font-size="14" text-anchor="middle" letter-spacing="4">
    DEEP LEARNING, PYTORCH &amp; COMPUTER VISION SYSTEMS
  </text>

  <!-- Issued Statement -->
  <text x="600" y="370" fill="#a1a1aa" font-family="'Courier New', monospace" font-size="13" text-anchor="middle" letter-spacing="3">
    VERIFIED RECORD OF COMPETENCY IN ARTIFICIAL INTELLIGENCE ENGINEERING
  </text>
  <text x="600" y="415" fill="#38bdf8" font-family="'Space Grotesk', 'Courier New', monospace" font-size="26" font-weight="bold" text-anchor="middle" letter-spacing="4">
    NEURAL ARCHITECTURES &amp; RESNET CLASSIFICATION
  </text>

  <!-- Recipient Info -->
  <line x1="380" y1="470" x2="820" y2="470" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
  <text x="600" y="505" fill="#f0f9ff" font-family="'Courier New', monospace" font-size="22" font-weight="bold" text-anchor="middle" letter-spacing="5">
    PRINCE KUMAR GAATE
  </text>
  <text x="600" y="530" fill="#71717a" font-family="'Courier New', monospace" font-size="11" text-anchor="middle" letter-spacing="2">
    CANDIDATE ID: ML-60291 // MODEL PIPELINE VERIFIED
  </text>

  <!-- Bottom Verification Footer -->
  <g transform="translate(100, 620)" font-family="'Courier New', monospace" font-size="11" fill="#71717a">
    <!-- Left: Issuing Org -->
    <text x="0" y="20" fill="#38bdf8" font-weight="bold" letter-spacing="2">ISSUING INSTITUTE:</text>
    <text x="0" y="42" fill="#d4d4d8" letter-spacing="1">AI LEARNING INITIATIVE &amp; DATA LABS</text>
    <text x="0" y="62" letter-spacing="1">APPLIED INTELLIGENCE CERTIFICATION</text>

    <!-- Center: Digital Seal -->
    <g transform="translate(500, -10)">
      <rect x="-40" y="-10" width="80" height="80" fill="#05121b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
      <polygon points="0,-2 18,12 18,36 0,50 -18,36 -18,12" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
      <text x="0" y="85" text-anchor="middle" font-size="8" fill="#38bdf8" letter-spacing="1">VERIFIED</text>
    </g>

    <!-- Right: Dates and Credential ID -->
    <text x="1000" y="20" text-anchor="end" fill="#38bdf8" font-weight="bold" letter-spacing="2">CREDENTIAL ID:</text>
    <text x="1000" y="42" text-anchor="end" fill="#7dd3fc" letter-spacing="2">AILI-2026-ML-9924</text>
    <text x="1000" y="62" text-anchor="end" letter-spacing="1">STATUS: CERTIFIED RECORD</text>
  </g>

  <!-- Bottom Security String -->
  <line x1="70" y1="730" x2="1130" y2="730" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.2" />
  <text x="600" y="750" fill="#52525b" font-family="'Courier New', monospace" font-size="9" text-anchor="middle" letter-spacing="3">
    [ DEVELOPMENT SAMPLE RECORD // REPLACE WITH OFFICIAL CREDENTIAL IN SRC/DATA/CERTIFICATIONSDATA.TS ]
  </text>
</svg>
