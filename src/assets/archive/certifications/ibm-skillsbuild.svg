<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGradIbm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d12" />
      <stop offset="50%" stop-color="#0f151c" />
      <stop offset="100%" stop-color="#080b0f" />
    </linearGradient>
    <pattern id="gridIbm" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.04" />
    </pattern>
    <filter id="glowIbm" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGradIbm)" />
  <rect width="1200" height="800" fill="url(#gridIbm)" />

  <!-- Outer Terminal Border -->
  <rect x="30" y="30" width="1140" height="740" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.3" />
  <rect x="42" y="42" width="1116" height="716" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="8 4" stroke-opacity="0.2" />

  <!-- Corner Brackets -->
  <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#38bdf8" stroke-width="3" />
  <path d="M 1150 20 L 1180 20 L 1180 50" fill="none" stroke="#38bdf8" stroke-width="3" />
  <path d="M 20 750 L 20 780 L 50 780" fill="none" stroke="#38bdf8" stroke-width="3" />
  <path d="M 1150 780 L 1180 780 L 1180 750" fill="none" stroke="#38bdf8" stroke-width="3" />

  <!-- Top System Header Strip -->
  <g fill="#38bdf8" font-family="'Courier New', monospace" font-size="12" letter-spacing="3" opacity="0.75">
    <text x="70" y="80">&gt; PRINCE.OS // ENTERPRISE_LEARNING // IBM-SKILLSBUILD</text>
    <text x="1130" y="80" text-anchor="end">WORKSHOP_COMPLETION.ARCHIVE</text>
    <line x1="70" y1="95" x2="1130" y2="95" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.3" />
  </g>

  <!-- Technical Icon / Data Science Network Badge -->
  <g transform="translate(600, 165)" filter="url(#glowIbm)">
    <polygon points="0,-45 40,-22 40,22 0,45 -40,22 -40,-22" fill="#081724" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.85" />
    <!-- Data science node graph vector -->
    <circle cx="0" cy="-14" r="5" fill="#38bdf8" />
    <circle cx="-16" cy="12" r="5" fill="#38bdf8" />
    <circle cx="16" cy="12" r="5" fill="#38bdf8" />
    <line x1="0" y1="-14" x2="-16" y2="12" stroke="#38bdf8" stroke-width="1.8" />
    <line x1="0" y1="-14" x2="16" y2="12" stroke="#38bdf8" stroke-width="1.8" />
    <line x1="-16" y1="12" x2="16" y2="12" stroke="#38bdf8" stroke-width="1.8" />
  </g>

  <!-- Category & Header -->
  <text x="600" y="245" fill="#a1a1aa" font-family="'Courier New', monospace" font-size="13" text-anchor="middle" letter-spacing="4">
    ENTERPRISE WORKSHOP &amp; DATA SCIENCE CERTIFICATION
  </text>
  <text x="600" y="285" fill="#eeffe4" font-family="'Space Grotesk', 'Courier New', monospace" font-size="34" font-weight="bold" text-anchor="middle" letter-spacing="6">
    IBM SKILLSBUILD
  </text>
  <text x="600" y="315" fill="#71717a" font-family="'Courier New', monospace" font-size="12" text-anchor="middle" letter-spacing="2">
    WORKSHOP CONDUCTED BY IBM OFFICIALS AT INSTITUTE CAMPUS
  </text>

  <!-- Completed Certifications Container with Both Certification Names -->
  <g transform="translate(600, 405)">
    <rect x="-440" y="-70" width="880" height="140" rx="4" fill="#081420" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.35" />
    <text x="0" y="-42" fill="#7dd3fc" font-family="'Courier New', monospace" font-size="11" text-anchor="middle" letter-spacing="3" font-weight="bold">
      SUCCESSFULLY COMPLETED CERTIFICATIONS:
    </text>
    
    <!-- Cert 1 -->
    <rect x="-380" y="-26" width="760" height="34" rx="2" fill="#0c1e30" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4" />
    <text x="-360" y="-4" fill="#38bdf8" font-family="'Courier New', monospace" font-size="11" font-weight="bold" letter-spacing="2">
      [01]
    </text>
    <text x="-315" y="-3" fill="#ffffff" font-family="'Space Grotesk', 'Courier New', monospace" font-size="16" font-weight="bold" letter-spacing="1.5">
      Getting Started with Enterprise Data Science
    </text>

    <!-- Cert 2 -->
    <rect x="-380" y="18" width="760" height="34" rx="2" fill="#0c1e30" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4" />
    <text x="-360" y="40" fill="#38bdf8" font-family="'Courier New', monospace" font-size="11" font-weight="bold" letter-spacing="2">
      [02]
    </text>
    <text x="-315" y="41" fill="#ffffff" font-family="'Space Grotesk', 'Courier New', monospace" font-size="16" font-weight="bold" letter-spacing="1.5">
      Enterprise Data Science
    </text>
  </g>

  <!-- Candidate Details -->
  <line x1="380" y1="510" x2="820" y2="510" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
  <text x="600" y="542" fill="#eeffe4" font-family="'Courier New', monospace" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="5">
    PRINCE KUMAR GAATE
  </text>
  <text x="600" y="567" fill="#71717a" font-family="'Courier New', monospace" font-size="11" text-anchor="middle" letter-spacing="2">
    WORKSHOP ATTENDEE // COMPLETED COURSEWORK
  </text>

  <!-- Bottom Technical Manifest Grid -->
  <g transform="translate(100, 635)" font-family="'Courier New', monospace" font-size="11" fill="#71717a">
    <!-- Left Column: Workshop Scope -->
    <text x="0" y="20" fill="#38bdf8" font-weight="bold" letter-spacing="2">ISSUING INITIATIVE:</text>
    <text x="0" y="42" fill="#d4d4d8" letter-spacing="1">IBM SKILLSBUILD</text>
    <text x="0" y="62" letter-spacing="1">CAMPUS ENTERPRISE SESSIONS</text>

    <!-- Center Column: Seal -->
    <g transform="translate(500, -10)">
      <rect x="-40" y="-10" width="80" height="80" fill="#05101a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
      <polygon points="0,-2 18,12 18,36 0,50 -18,36 -18,12" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1" />
      <text x="0" y="85" text-anchor="middle" font-size="8" fill="#38bdf8" letter-spacing="1">COMPLETED</text>
    </g>

    <!-- Right Column: Verification Status -->
    <text x="1000" y="20" text-anchor="end" fill="#38bdf8" font-weight="bold" letter-spacing="2">DOMAIN:</text>
    <text x="1000" y="42" text-anchor="end" fill="#eeffe4" letter-spacing="1">ENTERPRISE DATA SCIENCE</text>
    <text x="1000" y="62" text-anchor="end" fill="#71717a" letter-spacing="1">SCAN REPLACEMENT READY</text>
  </g>

  <!-- Bottom Terminal String -->
  <line x1="70" y1="730" x2="1130" y2="730" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.2" />
  <text x="600" y="752" fill="#52525b" font-family="'Courier New', monospace" font-size="9" text-anchor="middle" letter-spacing="3">
    [ OFFICIAL RECORD // CONFIGURE IMAGE SCAN IN SRC/DATA/CERTIFICATIONSDATA.TS ]
  </text>
</svg>
