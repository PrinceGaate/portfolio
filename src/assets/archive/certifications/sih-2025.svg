<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGradSih" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e0c" />
      <stop offset="50%" stop-color="#141411" />
      <stop offset="100%" stop-color="#0a0c0a" />
    </linearGradient>
    <pattern id="gridSih" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22c55e" stroke-width="0.5" stroke-opacity="0.04" />
    </pattern>
    <filter id="glowSih" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGradSih)" />
  <rect width="1200" height="800" fill="url(#gridSih)" />

  <!-- Outer Terminal Border -->
  <rect x="30" y="30" width="1140" height="740" fill="none" stroke="#22c55e" stroke-width="1.2" stroke-opacity="0.3" />
  <rect x="42" y="42" width="1116" height="716" fill="none" stroke="#22c55e" stroke-width="0.8" stroke-dasharray="8 4" stroke-opacity="0.2" />

  <!-- Corner Brackets -->
  <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#22c55e" stroke-width="3" />
  <path d="M 1150 20 L 1180 20 L 1180 50" fill="none" stroke="#22c55e" stroke-width="3" />
  <path d="M 20 750 L 20 780 L 50 780" fill="none" stroke="#22c55e" stroke-width="3" />
  <path d="M 1150 780 L 1180 780 L 1180 750" fill="none" stroke="#22c55e" stroke-width="3" />

  <!-- Top System Header Strip -->
  <g fill="#22c55e" font-family="'Courier New', monospace" font-size="12" letter-spacing="3" opacity="0.75">
    <text x="70" y="80">&gt; PRINCE.OS // HACKATHON_RECORDS // SIH-2025</text>
    <text x="1130" y="80" text-anchor="end">CAMPUS_INNOVATION_ROUND</text>
    <line x1="70" y1="95" x2="1130" y2="95" stroke="#22c55e" stroke-width="0.8" stroke-opacity="0.3" />
  </g>

  <!-- Technical Icon / Hackathon Code Circuit Badge -->
  <g transform="translate(600, 175)" filter="url(#glowSih)">
    <polygon points="0,-45 40,-22 40,22 0,45 -40,22 -40,-22" fill="#0c140c" stroke="#22c55e" stroke-width="2" stroke-opacity="0.85" />
    <!-- Terminal code bracket / beacon vector -->
    <path d="M -15 -14 L -22 0 L -15 14" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 15 -14 L 22 0 L 15 14" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="-5" y1="12" x2="5" y2="-12" stroke="#22c55e" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Category & Header -->
  <text x="600" y="260" fill="#a1a1aa" font-family="'Courier New', monospace" font-size="13" text-anchor="middle" letter-spacing="4">
    SMART INDIA HACKATHON 2025 INITIATIVE
  </text>
  <text x="600" y="302" fill="#eeffe4" font-family="'Space Grotesk', 'Courier New', monospace" font-size="34" font-weight="bold" text-anchor="middle" letter-spacing="6">
    SMART INDIA HACKATHON 2025
  </text>

  <!-- Hackathon Participation Box -->
  <g transform="translate(600, 395)">
    <rect x="-440" y="-55" width="880" height="110" rx="4" fill="#0e160e" stroke="#22c55e" stroke-width="1" stroke-opacity="0.35" />
    <text x="0" y="-22" fill="#71717a" font-family="'Courier New', monospace" font-size="12" text-anchor="middle" letter-spacing="3">
      INTERNAL HACKATHON PARTICIPATION
    </text>
    <text x="0" y="10" fill="#22c55e" font-family="'Space Grotesk', 'Courier New', monospace" font-size="18" font-weight="bold" text-anchor="middle" letter-spacing="2">
      Held on 19 September 2025 at Institute Campus
    </text>
    <text x="0" y="34" fill="#a1a1aa" font-family="'Courier New', monospace" font-size="12" text-anchor="middle" letter-spacing="2">
      SMART INDIA HACKATHON 2025 INSTITUTIONAL EVALUATION ROUND
    </text>
  </g>

  <!-- Candidate Details -->
  <line x1="380" y1="495" x2="820" y2="495" stroke="#22c55e" stroke-width="1" stroke-opacity="0.3" />
  <text x="600" y="530" fill="#eeffe4" font-family="'Courier New', monospace" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="5">
    PRINCE KUMAR GAATE
  </text>
  <text x="600" y="555" fill="#71717a" font-family="'Courier New', monospace" font-size="11" text-anchor="middle" letter-spacing="2">
    INTERNAL HACKATHON PARTICIPANT // DEVELOPER
  </text>

  <!-- Bottom Technical Manifest Grid -->
  <g transform="translate(100, 630)" font-family="'Courier New', monospace" font-size="11" fill="#71717a">
    <!-- Left Column: Hackathon Event -->
    <text x="0" y="20" fill="#22c55e" font-weight="bold" letter-spacing="2">EVENT INITIATIVE:</text>
    <text x="0" y="42" fill="#d4d4d8" letter-spacing="1">SMART INDIA HACKATHON 2025</text>
    <text x="0" y="62" letter-spacing="1">CAMPUS INTERNAL HACKATHON</text>

    <!-- Center Column: Seal -->
    <g transform="translate(500, -10)">
      <rect x="-40" y="-10" width="80" height="80" fill="#081008" stroke="#22c55e" stroke-width="1" stroke-opacity="0.4" />
      <polygon points="0,-2 18,12 18,36 0,50 -18,36 -18,12" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1" />
      <text x="0" y="85" text-anchor="middle" font-size="8" fill="#22c55e" letter-spacing="1">VERIFIED</text>
    </g>

    <!-- Right Column: Date & Status -->
    <text x="1000" y="20" text-anchor="end" fill="#22c55e" font-weight="bold" letter-spacing="2">DATE OF EVENT:</text>
    <text x="1000" y="42" text-anchor="end" fill="#eeffe4" letter-spacing="1">19 SEPTEMBER 2025</text>
    <text x="1000" y="62" text-anchor="end" fill="#71717a" letter-spacing="1">SCAN REPLACEMENT READY</text>
  </g>

  <!-- Bottom Terminal String -->
  <line x1="70" y1="730" x2="1130" y2="730" stroke="#22c55e" stroke-width="0.8" stroke-opacity="0.2" />
  <text x="600" y="752" fill="#52525b" font-family="'Courier New', monospace" font-size="9" text-anchor="middle" letter-spacing="3">
    [ OFFICIAL RECORD // CONFIGURE IMAGE SCAN IN SRC/DATA/CERTIFICATIONSDATA.TS ]
  </text>
</svg>
