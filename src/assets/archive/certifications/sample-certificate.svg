<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e0c" />
      <stop offset="50%" stop-color="#121412" />
      <stop offset="100%" stop-color="#0a0c0a" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#33ff33" stroke-width="0.5" stroke-opacity="0.03" />
    </pattern>
    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)" />
  <rect width="1200" height="800" fill="url(#grid)" />

  <!-- Outer Terminal Border -->
  <rect x="30" y="30" width="1140" height="740" fill="none" stroke="#33ff33" stroke-width="1.2" stroke-opacity="0.25" />
  <rect x="42" y="42" width="1116" height="716" fill="none" stroke="#33ff33" stroke-width="0.8" stroke-dasharray="8 4" stroke-opacity="0.18" />

  <!-- Corner Brackets -->
  <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#33ff33" stroke-width="3" />
  <path d="M 1150 20 L 1180 20 L 1180 50" fill="none" stroke="#33ff33" stroke-width="3" />
  <path d="M 20 750 L 20 780 L 50 780" fill="none" stroke="#33ff33" stroke-width="3" />
  <path d="M 1150 780 L 1180 780 L 1180 750" fill="none" stroke="#33ff33" stroke-width="3" />

  <!-- Header Header Line -->
  <g fill="#33ff33" font-family="'Courier New', monospace" font-size="12" letter-spacing="3" opacity="0.6">
    <text x="70" y="80">&gt; PRINCE.OS // CREDENTIAL_STORAGE_SUBSYSTEM</text>
    <text x="1130" y="80" text-anchor="end">SYS.AUTH.CLASS-4</text>
    <line x1="70" y1="95" x2="1130" y2="95" stroke="#33ff33" stroke-width="0.8" stroke-opacity="0.3" />
  </g>

  <!-- Watermark Badge -->
  <g transform="translate(600, 400) rotate(-18)" opacity="0.12">
    <rect x="-240" y="-55" width="480" height="110" fill="none" stroke="#33ff33" stroke-width="5" stroke-dasharray="16 8" />
    <text x="0" y="15" fill="#33ff33" font-family="'Courier New', monospace" font-size="34" font-weight="bold" text-anchor="middle" letter-spacing="6">
      SAMPLE CERTIFICATE
    </text>
  </g>

  <!-- Certificate Authority / Shield Icon -->
  <g transform="translate(600, 175)" filter="url(#greenGlow)">
    <polygon points="0,-45 40,-25 40,25 0,45 -40,25 -40,-25" fill="#0b170b" stroke="#33ff33" stroke-width="2" stroke-opacity="0.8" />
    <path d="M -16 -8 L -4 14 L 16 -16" fill="none" stroke="#33ff33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Certificate Title -->
  <text x="600" y="270" fill="#eeffe4" font-family="'Space Grotesk', 'Courier New', monospace" font-size="36" font-weight="bold" text-anchor="middle" letter-spacing="8">
    CERTIFICATE OF PROFICIENCY
  </text>
  <text x="600" y="305" fill="#7dd3fc" font-family="'Courier New', monospace" font-size="14" text-anchor="middle" letter-spacing="4">
    FULL-STACK WEB DEVELOPMENT &amp; BACKEND ARCHITECTURE
  </text>

  <!-- Issued Statement -->
  <text x="600" y="370" fill="#a1a1aa" font-family="'Courier New', monospace" font-size="13" text-anchor="middle" letter-spacing="3">
    THIS DOCUMENT CONFIRMS OFFICIAL COMPLETION OF PRACTICAL CURRICULUM IN
  </text>
  <text x="600" y="415" fill="#33ff33" font-family="'Space Grotesk', 'Courier New', monospace" font-size="26" font-weight="bold" text-anchor="middle" letter-spacing="4">
    REACT, TYPESCRIPT &amp; DISTRIBUTED NODE.JS SYSTEMS
  </text>

  <!-- Recipient Info -->
  <line x1="380" y1="470" x2="820" y2="470" stroke="#33ff33" stroke-width="1" stroke-opacity="0.4" />
  <text x="600" y="505" fill="#eeffe4" font-family="'Courier New', monospace" font-size="22" font-weight="bold" text-anchor="middle" letter-spacing="5">
    PRINCE KUMAR GAATE
  </text>
  <text x="600" y="530" fill="#71717a" font-family="'Courier New', monospace" font-size="11" text-anchor="middle" letter-spacing="2">
    CANDIDATE ID: DEV-88392 // VERIFIED REPOSITORY
  </text>

  <!-- Bottom Verification Footer -->
  <g transform="translate(100, 620)" font-family="'Courier New', monospace" font-size="11" fill="#71717a">
    <!-- Left: Issuing Org -->
    <text x="0" y="20" fill="#33ff33" font-weight="bold" letter-spacing="2">ISSUING ORGANIZATION:</text>
    <text x="0" y="42" fill="#d4d4d8" letter-spacing="1">TECHNICAL ACCREDITATION LABS</text>
    <text x="0" y="62" letter-spacing="1">CURRICULUM SPECIFICATION 2026.1</text>

    <!-- Center: QR / Digital Seal -->
    <g transform="translate(500, -10)">
      <rect x="-40" y="-10" width="80" height="80" fill="#080e08" stroke="#33ff33" stroke-width="1" stroke-opacity="0.5" />
      <rect x="-30" y="0" width="20" height="20" fill="#33ff33" fill-opacity="0.7" />
      <rect x="10" y="0" width="20" height="20" fill="#33ff33" fill-opacity="0.7" />
      <rect x="-30" y="40" width="20" height="20" fill="#33ff33" fill-opacity="0.7" />
      <rect x="5" y="35" width="15" height="15" fill="#33ff33" fill-opacity="0.4" />
      <text x="0" y="85" text-anchor="middle" font-size="8" fill="#33ff33" letter-spacing="1">DIGITAL SEAL</text>
    </g>

    <!-- Right: Dates and Credential ID -->
    <text x="1000" y="20" text-anchor="end" fill="#33ff33" font-weight="bold" letter-spacing="2">CREDENTIAL ID:</text>
    <text x="1000" y="42" text-anchor="end" fill="#7dd3fc" letter-spacing="2">TAL-2026-FSD-0482</text>
    <text x="1000" y="62" text-anchor="end" letter-spacing="1">STATUS: ACTIVE &amp; AUTHENTICATED</text>
  </g>

  <!-- Bottom Security String -->
  <line x1="70" y1="730" x2="1130" y2="730" stroke="#33ff33" stroke-width="0.8" stroke-opacity="0.2" />
  <text x="600" y="750" fill="#52525b" font-family="'Courier New', monospace" font-size="9" text-anchor="middle" letter-spacing="3">
    [ DEVELOPMENT SAMPLE RECORD // REPLACE WITH OFFICIAL CREDENTIAL IN SRC/DATA/CERTIFICATIONSDATA.TS ]
  </text>
</svg>
